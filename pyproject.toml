[project]
name = "vespa"
version = "0.1.0"
description = "The SuperWASP Variable Star Photometry Archive."
requires-python = ">=3.14,<4"
dependencies = [
    "django>=5.2.18,<6",
    "gunicorn",
    "psycopg2",
    "astropy",
    "humanize",
    "celery",
    "pyyaml",
    "django-celery-results",
    "seaborn",
    "pillow",
    "sentry-sdk",
    "ujson",
    "markdown",
    "panoptes-client",
    "pandas",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-pspec",
    "pytest-django",
    "pytest-mock",
    "pytest-pythonpath",
    "pylint",
]

[tool.uv]
package = false
